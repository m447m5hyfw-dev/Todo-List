<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Meine Todo-Liste mit 24h-Timer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      background: #fff;
      padding: 20px 20px 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    #taskInput {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    #addBtn {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
    }
    #addBtn:hover {
      background: #1d4ed8;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      border-bottom: 1px solid #eee;
    }
    li:last-child {
      border-bottom: none;
    }
    .task-text {
      flex: 1;
      margin-left: 8px;
    }
    .completed .task-text {
      text-decoration: line-through;
      color: #888;
    }
    .timer {
      font-size: 12px;
      color: #555;
      margin-left: 8px;
    }
    .delete-btn {
      margin-left: 8px;
      padding: 4px 8px;
      border: none;
      border-radius: 4px;
      background: #ef4444;
      color: #fff;
      cursor: pointer;
      font-size: 12px;
    }
    .empty {
      text-align: center;
      color: #888;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Meine Todo-Liste</h1>

    <div class="input-row">
      <input
        id="taskInput"
        type="text"
        placeholder="Neue Aufgabe eingeben..."
      />
      <button id="addBtn">Hinzufügen</button>
    </div>

    <ul id="taskList"></ul>
    <div id="emptyMessage" class="empty">Noch keine Aufgaben.</div>
  </div>

  <script>
    // Struktur einer Aufgabe:
    // {
    //   id: number,
    //   text: string,
    //   completed: boolean,
    //   completedAt: number | null (Timestamp in ms, wenn erledigt)
    // }

    const STORAGE_KEY = "todoTasksWithTimer";

    let tasks = [];

    // Beim Laden der Seite: Tasks aus localStorage holen
    function loadTasks() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        try {
          tasks = JSON.parse(stored);
        } catch {
          tasks = [];
        }
      }
    }

    // Tasks in localStorage speichern
    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    // Neue Aufgabe hinzufügen
    function addTask() {
      const input = document.getElementById("taskInput");
      const text = input.value.trim();
      if (!text) return;

      const newTask = {
        id: Date.now(), // einfache eindeutige ID
        text,
        completed: false,
        completedAt: null,
      };

      tasks.push(newTask);
      saveTasks();
      render();
      input.value = "";
      input.focus();
    }

    // Aufgabe als erledigt / nicht erledigt markieren
    function toggleTask(id) {
      const task = tasks.find((t) => t.id === id);
      if (!task) return;

      if (!task.completed) {
        // wird jetzt erledigt -> Timer startet
        task.completed = true;
        task.completedAt = Date.now();
      } else {
        // wird wieder aktiv -> Timer zurücksetzen
        task.completed = false;
        task.completedAt = null;
      }

      saveTasks();
      render();
    }

    // Aufgabe sofort löschen
    function deleteTask(id) {
      tasks = tasks.filter((t) => t.id !== id);
      saveTasks();
      render();
    }

    // Erledigte Aufgaben löschen, deren 24h abgelaufen sind
    function cleanupExpiredCompletedTasks() {
      const now = Date.now();
      const TWENTY_FOUR_HOURS = 24 * 60 * 60 * 1000;

      const before = tasks.length;
      tasks = tasks.filter((t) => {
        if (!t.completed || t.completedAt == null) return true;
        const elapsed = now - t.completedAt;
        return elapsed < TWENTY_FOUR_HOURS;
      });

      if (tasks.length !== before) {
        saveTasks();
        render();
      }
    }

    // Liste im Browser anzeigen
    function render() {
      const list = document.getElementById("taskList");
      const emptyMessage = document.getElementById("emptyMessage");
      list.innerHTML = "";

      if (tasks.length === 0) {
        emptyMessage.style.display = "block";
        return;
      } else {
        emptyMessage.style.display = "none";
      }

      const TWENTY_FOUR_HOURS = 24 * 60 * 60 * 1000;

      tasks.forEach((task) => {
        const li = document.createElement("li");
        if (task.completed) li.classList.add("completed");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.completed;
        checkbox.onchange = () => toggleTask(task.id);

        const textSpan = document.createElement("span");
        textSpan.className = "task-text";
        textSpan.textContent = task.text;

        li.appendChild(checkbox);
        li.appendChild(textSpan);

        if (task.completed && task.completedAt != null) {
          const timerSpan = document.createElement("span");
          timerSpan.className = "timer";
          // Restzeit berechnen
          const elapsed = Date.now() - task.completedAt;
          const remaining = Math.max(0, TWENTY_FOUR_HOURS - elapsed);
          const hoursLeft = Math.floor(remaining / (60 * 60 * 1000));
          const minutesLeft = Math.floor(
            (remaining % (60 * 60 * 1000)) / (60 * 1000)
          );
          timerSpan.textContent = `Noch ca. ${hoursLeft}h ${minutesLeft}min`;
          li.appendChild(timerSpan);
        }

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-btn";
        deleteBtn.textContent = "Löschen";
        deleteBtn.onclick = () => deleteTask(task.id);
        li.appendChild(deleteBtn);

        list.appendChild(li);
      });
    }

    // Initialisierung
    document.getElementById("addBtn").onclick = addTask;
    document.getElementById("taskInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") addTask();
    });

    loadTasks();
    render();

    // Alle Minute prüfen, ob erledigte Aufgaben gelöscht werden müssen
    setInterval(cleanupExpiredCompletedTasks, 60 * 1000);
    // Beim Start auch einmal prüfen
    cleanupExpiredCompletedTasks();
  </script>
</body>
</html>
